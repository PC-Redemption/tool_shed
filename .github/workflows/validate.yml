name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.x"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        include:
          - os: ubuntu-latest
            test-jobs: 8
          - os: windows-latest
            test-jobs: 6
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate tool_shed
        run: python scripts/validate_tool_shed.py --profile release --warn-seconds 60 --max-seconds 300 --jobs ${{ matrix.test-jobs }} --shard-index ${{ matrix.shard }} --shard-count 8

      - name: Smoke POSIX launcher
        if: runner.os == 'Linux'
        run: scripts/update-tool-shed.sh --help

      - name: Smoke PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/update-tool-shed.ps1 --help
