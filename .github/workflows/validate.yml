name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            test-jobs: 8
          - os: ubuntu-latest
            python-version: "3.x"
            test-jobs: 8
          - os: windows-latest
            python-version: "3.11"
            test-jobs: 16
          - os: windows-latest
            python-version: "3.x"
            test-jobs: 16
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate tool_shed
        run: python scripts/validate_tool_shed.py --profile release --max-seconds 60 --jobs ${{ matrix.test-jobs }}

      - name: Smoke POSIX launcher
        if: runner.os == 'Linux'
        run: scripts/update-tool-shed.sh --help

      - name: Smoke PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/update-tool-shed.ps1 --help
