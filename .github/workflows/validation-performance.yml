name: Validation Performance

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-jobs: 8
          - os: windows-latest
            test-jobs: 6
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up current Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Measure primary release-validation shard
        run: python scripts/benchmark_validation.py --samples 3 --jobs ${{ matrix.test-jobs }} --shard-index 0 --shard-count 8 --warning-median-seconds 60 --max-median-seconds 180
